# vim:ts=2:sw=2:et:ai:sts=2

default_install_hook_types:
  - pre-push

default_language_version:
  node: 20.19.2

repos:
  # Generic.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-shebang-scripts-are-executable
      - id: check-merge-conflict
      - id: check-symlinks
        exclude: |
          (?x)^(
            playbooks/group_vars/all/apt/calculated_vars.yaml
          )$
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  # Ansible.
  - repo: https://github.com/ansible/ansible-lint
    rev: v25.2.1
    hooks:
      - id: ansible-lint
        additional_dependencies:
          - ansible

  # Shell scripts.
  - repo: local
    hooks:
      # Needs `apt install shfmt` or `brew install shfmt`.
      - id: shfmt
        name: shfmt
        description: Shell source code formatter
        language: system
        entry: shfmt
        args: [-w]
        types: [shell]
        exclude_types: [csh, tcsh, zsh]

      # Needs `apt install shellcheck` or `brew install shellcheck`.
      - id: shellcheck
        name: shellcheck
        description: Static analysis tool for shell scripts
        language: system
        entry: shellcheck
        args: [-f, gcc, -x]
        types: [shell]

  # Markdown
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
