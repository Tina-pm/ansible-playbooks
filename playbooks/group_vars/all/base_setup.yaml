# vim:ts=2:sw=2:et:ai:sts=2
---
# =============================================================================
# Reusable defaults and templates for base-setup role.
# =============================================================================

base_setup__enable: true
base_setup__set_hostname: '{{ host_fqdn }}'
base_setup__disable_cloud_init: true
base_setup__disable_resolved: true

base_setup__apt_upgrade: false

# Packages with the same name on Debian and RedHat OS families.
base_setup__pkg_install__common__base:
  - acl  # Needed for becoming a non-root user.
  - dbus
  - logrotate
  - rsyslog

base_setup__pkg_install__common__utils:
  - bash-completion
  - info
  - less
  - lsof
  - ncurses-term
  - tmux

base_setup__pkg_install__common__netutils:
  - rsync
  - socat
  - strace
  - tcpdump

# Debian-only names, including packages without a RedHat equivalent.
base_setup__pkg_install__debian__base:
  - cron
  - cron-apt
  - linux-sysctl-defaults  # Need for non-root ping.
  - mailutils

base_setup__pkg_install__debian__utils:
  - kitty-terminfo
  - man
  - manpages
  - moreutils
  - screen
  - vim

base_setup__pkg_install__debian__netutils:
  - bind9-host
  - netcat-openbsd

base_setup__pkg_install__debian__locate:
  - |-
    {{
      'mlocate' if (
        apt__distro_ver is version('11', 'lt')
        if (apt__vendor | d('debian')) == 'debian' else
        apt__distro_ver is version('22.04', 'lt')
      ) else 'plocate'
    }}

# RedHat-only names for tools with a different package name on Debian.
base_setup__pkg_install__redhat__base:
  - cronie

base_setup__pkg_install__redhat__utils:
  - man-db
  - man-pages
  - vim-enhanced

base_setup__pkg_install__redhat__netutils:
  - bind-utils
  - nmap-ncat

base_setup__pkg_install__redhat__locate:
  - mlocate

base_setup__setup_locales: true
base_setup__default_locale: en_IE.UTF-8
base_setup__locales_to_be_generated:
  - en_IE.UTF-8 UTF-8
  - en_US.UTF-8 UTF-8
  - es_AR.UTF-8 UTF-8
  - es_ES.UTF-8 UTF-8

# Agregation of custom configuration using var prefixes
# -----------------------------------------------------------------------------

base_setup__pkg_install__common: |-
  {{
    query('vars',
      *(query('varnames', '^base_setup__pkg_install__common__.*') | sort)
    ) | sum(start=[])
  }}

base_setup__pkg_install__debian: |-
  {{
    query('vars',
      *(query('varnames', '^base_setup__pkg_install__debian__.*') | sort)
    ) | sum(start=[])
  }}

base_setup__pkg_install__redhat: |-
  {{
    query('vars',
      *(query('varnames', '^base_setup__pkg_install__redhat__.*') | sort)
    ) | sum(start=[])
  }}

base_setup__pkg_install_for_debian: >-
  {{ base_setup__pkg_install__common + base_setup__pkg_install__debian }}

base_setup__pkg_install_for_redhat: >-
  {{ base_setup__pkg_install__common + base_setup__pkg_install__redhat }}
