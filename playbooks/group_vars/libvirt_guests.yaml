# vim:ts=2:sw=2:et:ai:sts=2
---
# =============================================================================
# Reusable defaults for libvirt guests.
# =============================================================================

# Connect using QEMU guest agent.
libvirt__vm_use_qemu_connection: true
ansible_connection: |-
  {{
    'community.libvirt.libvirt_qemu' if
    libvirt__vm_use_qemu_connection | bool else
    'ansible.builtin.ssh'
  }}
ansible_libvirt_uri: |-
  qemu+ssh://{{
    hostvars[vm_host].get('ansible_ssh_host') or
    hostvars[vm_host].get('ansible_host') or
    hostvars[vm_host].get('inventory_hostname')
  }}/system
ansible_host: |-
  {{ vm_name if libvirt__vm_use_qemu_connection | bool else host_fqdn }}

# Guest operating system. Supported values are in vm_os_supported.
# Defaults to the APT vendor so existing guests keep working.
vm_os: '{{ apt__vendor }}'
vm_os_supported:
  - debian
  - ubuntu
  - rocky

bootstrap__install_packages__libvirt:
  - openssh-server
  - qemu-guest-agent  # Needed for ansible/libvirt connection.

bootstrap__install_packages__libvirt_os: |-
  {{
    ['ifupdown'] if (vm_os | d('debian')) in ['debian', 'ubuntu'] else []
  }}

# VM definition parameters.
vm_name: '{{ inventory_hostname_short }}'
vm_default_params:
  memory_mb: 1024
  vcpus: 1
  autostart: true
vm_params: {}

# Discover custom configurations using var prefixes
# (e.g. vm_volume__root). The volume with `root: true` receives the image.
vm_volumes: |-
  {{ query('vars', *(query('varnames', '^vm_volume__.*') | sort)) | select }}
vm_interfaces: |-
  {{ query('vars', *(query('varnames', '^vm_interface__.*') | sort)) | select }}

vm_image_variant: |-
  {{
    'genericcloud' if vm_os == 'debian' else
    'server-cloudimg'
  }}
vm_image_arch: amd64

# Rocky Linux cloud image settings.
vm_image_rocky_ver: '10'
vm_image_rocky_variant: GenericCloud-Base
vm_image_rocky_arch: x86_64

# yamllint disable rule:quoted-strings
_vm_image_url_debian:
  "http://cloud.debian.org/images/cloud/{distro_name}/latest/\
   debian-{distro_ver}-{variant}-{arch}.qcow2"
_vm_image_url_ubuntu:
  "https://cloud-images.ubuntu.com/{distro_name}/current/\
   {distro_name}-{variant}-{arch}.img"
_vm_image_url_rocky:
  "https://dl.rockylinux.org/pub/rocky/{rocky_ver}/images/{arch}/\
   Rocky-{rocky_ver}-{rocky_variant}.latest.{arch}.qcow2"
# yamllint enable rule:quoted-strings
vm_image_url: |-
  {{
    _vm_image_url_rocky.format(
      rocky_ver=vm_image_rocky_ver,
      rocky_variant=vm_image_rocky_variant,
      arch=vm_image_rocky_arch,
    ) if vm_os == 'rocky' else
    (
      _vm_image_url_debian if vm_os == 'debian' else
      _vm_image_url_ubuntu
    ).format(
      distro_name=apt__distro_name,
      distro_ver=apt__distro_ver,
      variant=vm_image_variant,
      arch=vm_image_arch,
    )
  }}

# Name of the root disk volume. Set `root: true` on the volume that
# should receive the guest image.
vm_root_lv: vm-{{ inventory_hostname_short }}-root

vm_volume__00_root:
  root: true  # Volume that receives the guest image.
  lv: '{{ vm_root_lv }}'
  vg: vg0
  thinpool: ~  # Name of an existing thin pool in vg, if any.
  target: vda
  type: block
  size: 10G
  format: raw
  mount: ~  # Partitioned device.

_host_iface_prefix: |-
  {% set _len = ('vm-%s-en0' % vm_name) | length %}
  {{ 'vm-%s' % (vm_name if _len <= 15 else vm_name[:15 - _len]) }}
vm_interface__00_pubbr:
  type: bridge
  mac: '{{ pubnet_hwaddr }}'
  source:
    dev: vmbr0
  target:
    dev: '{{ _host_iface_prefix }}-en0'
vm_interface__01_privbr:
  type: bridge
  mac: '{{ privnet_hwaddr }}'
  source:
    dev: vmbr1
  target:
    dev: '{{ _host_iface_prefix }}-en1'

# Construct complete VM definition.
libvirt__vm_def: |-
  {{
    vm_default_params |
    combine(vm_params or {}) |
    combine({
      'name': vm_name,
      'volumes': vm_volumes,
      'interfaces': vm_interfaces,
    })
  }}
